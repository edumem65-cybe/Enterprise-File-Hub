name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The core has no runtime dependencies: Node runs the TypeScript tests directly.
      - name: Unit tests (apps/api)
        working-directory: apps/api
        run: node --test "src/**/*.test.ts"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev compose file
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.dev.yml config -q

  postgres-integration:
    runs-on: ubuntu-latest
    # The adapter and its SQL were written without a database at hand. Remove continue-on-error once this job is green.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: filehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pg driver (test only)
        working-directory: apps/api
        run: npm install --no-save pg@8
      - name: Integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/filehub
        run: node --test "src/**/*.integration.test.ts"
